name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache: false
      - name: Release gate
        run: |
          test -z "$(gofmt -l cmd internal)"
          go test -short ./...
          go vet ./...
          go run honnef.co/go/tools/cmd/staticcheck@2026.1 ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  build:
    needs: verify
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64, ext: '' }
          - { os: linux, arch: arm64, ext: '' }
          - { os: darwin, arch: amd64, ext: '' }
          - { os: darwin, arch: arm64, ext: '' }
          - { os: windows, arch: amd64, ext: '.exe' }
          - { os: windows, arch: arm64, ext: '.exe' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache: false
      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
          CATALOG_KEY_ID: ${{ vars.CATALOG_KEY_ID }}
          CATALOG_PUBLIC_KEY: ${{ vars.CATALOG_ED25519_PUBLIC_KEY_BASE64 }}
        run: |
          case "$GITHUB_REF_NAME" in
            v*)
              test -n "$CATALOG_KEY_ID"
              test -n "$CATALOG_PUBLIC_KEY"
              ;;
          esac
          mkdir -p dist
          name="jkv-${GOOS}-${GOARCH}${{ matrix.ext }}"
          go build -buildvcs=false -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME} -X main.catalogKeyID=${CATALOG_KEY_ID} -X main.catalogPublicKeyBase64=${CATALOG_PUBLIC_KEY}" -o "dist/$name" ./cmd/jkv
          (cd dist && sha256sum "$name" > "$name.sha256")
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          file: dist/jkv-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}
          format: spdx-json
          output-file: dist/jkv-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  installers:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Stamp installer release coordinates
        env:
          CN_DOWNLOAD_BASE: ${{ vars.JKV_CN_DOWNLOAD_BASE }}
        run: |
          mkdir -p dist
          cp install.sh install.ps1 dist/
          if [ -n "$CN_DOWNLOAD_BASE" ]; then
            stamped="${CN_DOWNLOAD_BASE%/}/${GITHUB_REF_NAME}"
            sed -i "s|__JKV_CN_DOWNLOAD_BASE__|$stamped|g" dist/install.sh dist/install.ps1
          fi
          sed -i "s|__JKV_RELEASE_VERSION__|${GITHUB_REF_NAME}|g" dist/install.sh dist/install.ps1
          (cd dist && sha256sum install.sh > install.sh.sha256)
          (cd dist && sha256sum install.ps1 > install.ps1.sha256)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-installers
          path: dist/
          if-no-files-found: error

  publish:
    needs: [build, installers]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Attest release assets
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*
      - name: Export provenance bundle and verify release layout
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE_PATH" "dist/${GITHUB_REF_NAME}.provenance.sigstore.json"
          chmod +x dist/jkv-linux-amd64
          test -x dist/jkv-linux-amd64
          test "$(find dist -maxdepth 1 -type f -name 'jkv-*.spdx.json' | wc -l)" -eq 6
          test "$(find dist -maxdepth 1 -type f -name 'jkv-*.sha256' | wc -l)" -eq 6
          (cd dist && for sum in *.sha256; do sha256sum --check "$sum"; done)
          test "$(./dist/jkv-linux-amd64 version)" = "jkv ${GITHUB_REF_NAME}"
          test -s "dist/${GITHUB_REF_NAME}.provenance.sigstore.json"
      - name: Create and verify GitHub draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes" ]; then
            echo "缺少版本发布说明: $notes" >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true || {
              echo "GitHub release already published: $GITHUB_REF_NAME" >&2
              exit 1
            }
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --draft \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$notes" \
              "${flags[@]}"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          mkdir github-draft
          gh release download "$GITHUB_REF_NAME" --dir github-draft --pattern '*'
          for file in dist/*; do
            cmp "$file" "github-draft/$(basename "$file")"
          done
      - name: Create and verify CNB draft release
        env:
          CNB_TOKEN: ${{ secrets.CNB_JKV_TOKEN }}
          CNB_REPOSITORY: ${{ vars.CNB_JKV_REPOSITORY }}
          CNB_DOWNLOAD_BASE: ${{ vars.JKV_CN_DOWNLOAD_BASE }}
        run: |
          test -n "$CNB_TOKEN" || { echo '缺少 CNB_JKV_TOKEN' >&2; exit 1; }
          test -n "$CNB_REPOSITORY" || { echo '缺少 CNB_JKV_REPOSITORY' >&2; exit 1; }
          expected_base="https://cnb.cool/${CNB_REPOSITORY}/-/releases/download"
          test "${CNB_DOWNLOAD_BASE%/}" = "$expected_base" || {
            echo "JKV_CN_DOWNLOAD_BASE 必须为 $expected_base" >&2
            exit 1
          }
          api="https://api.cnb.cool/${CNB_REPOSITORY}/-/releases"
          headers=(-H "Authorization: Bearer $CNB_TOKEN" -H 'Accept: application/vnd.cnb.api+json')
          releases="$(curl -fsS "$api?page=1&page_size=100" "${headers[@]}" || true)"
          existing="$(jq -e --arg tag "$GITHUB_REF_NAME" '.[]? | select(.tag_name == $tag)' <<<"$releases" || true)"
          release_id="$(jq -r '.id // empty' <<<"$existing")"
          upload_assets=false
          if test -z "$release_id"; then
            release="$(curl -sS --fail-with-body -X POST "$api" "${headers[@]}" -H 'Content-Type: application/json' \
              --data "$(jq -nc --arg tag "$GITHUB_REF_NAME" --arg commit "$GITHUB_SHA" '{tag_name:$tag,target_commitish:"main",name:$tag,body:("jkv release from GitHub commit " + $commit),draft:true,make_latest:"false"}')")"
            release_id="$(jq -er '.id' <<<"$release")"
            upload_assets=true
          elif test "$(jq -er '.draft' <<<"$existing")" != true; then
            echo "CNB release already published; verify existing assets: $GITHUB_REF_NAME"
          else
            upload_assets=true
          fi
          upload() {
            file="$1"
            form="$(jq -nc --arg name "$(basename "$file")" --argjson size "$(wc -c < "$file")" '{asset_name:$name,size:$size,ttl:0,overwrite:true}')"
            ticket="$(curl -fsS -X POST "$api/$release_id/asset-upload-url" "${headers[@]}" -H 'Content-Type: application/json' --data "$form")"
            curl -fsS -X PUT --upload-file "$file" "$(jq -er '.upload_url' <<<"$ticket")"
            curl -fsS -X POST "${headers[@]}" "$(jq -er '.verify_url' <<<"$ticket")?ttl=0"
          }
          if test "$upload_assets" = true; then
            for file in dist/*; do upload "$file"; done
          fi
          release_after_upload="$(curl -fsS "$api/$release_id" "${headers[@]}")"
          verify_cnb_asset() {
            file="$1"
            name="$(basename "$file")"
            asset="$(jq -e --arg name "$name" '.assets[]? | select(.name == $name)' <<<"$release_after_upload")" || {
              echo "CNB asset not found after upload: $name" >&2
              return 1
            }
            hash_algo="$(jq -er '.hash_algo // empty' <<<"$asset" | tr '[:upper:]' '[:lower:]')"
            expected_hash="$(jq -er '.hash_value' <<<"$asset" | tr '[:upper:]' '[:lower:]')"
            expected_size="$(jq -er '.size' <<<"$asset")"
            actual_hash="$(sha256sum "$file" | awk '{print $1}')"
            actual_size="$(wc -c < "$file" | tr -d '[:space:]')"
            case "$hash_algo" in sha256|sha-256|sha_256) ;; *) echo "unsupported CNB hash algorithm for $name: $hash_algo" >&2; return 1 ;; esac
            test "$actual_size" = "$expected_size" || { echo "CNB size mismatch for $name" >&2; return 1; }
            test "$actual_hash" = "$expected_hash" || { echo "CNB SHA-256 mismatch for $name" >&2; return 1; }
          }
          for file in dist/*; do verify_cnb_asset "$file"; done
          printf '%s' "$release_id" > cnb-release-id
      - name: Publish GitHub and CNB releases
        env:
          GH_TOKEN: ${{ github.token }}
          CNB_TOKEN: ${{ secrets.CNB_JKV_TOKEN }}
          CNB_REPOSITORY: ${{ vars.CNB_JKV_REPOSITORY }}
        run: |
          api="https://api.cnb.cool/${CNB_REPOSITORY}/-/releases"
          release_id="$(cat cnb-release-id)"
          curl -fsS -X PATCH "$api/$release_id" \
            -H "Authorization: Bearer $CNB_TOKEN" \
            -H 'Accept: application/vnd.cnb.api+json' \
            -H 'Content-Type: application/json' \
            --data '{"draft":false,"make_latest":"false"}' >/dev/null
          published="$(curl -fsS "$api/$release_id" -H "Authorization: Bearer $CNB_TOKEN" -H 'Accept: application/vnd.cnb.api+json')"
          test "$(jq -er '.draft' <<<"$published")" = false
          github_release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate | jq -er --arg tag "$GITHUB_REF_NAME" '.[] | select(.tag_name == $tag) | .id')"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/$github_release_id" \
            -F draft=false -F make_latest=false >/dev/null
      - name: Verify public GitHub and CNB bytes
        env:
          GH_TOKEN: ${{ github.token }}
          CNB_DOWNLOAD_BASE: ${{ vars.JKV_CN_DOWNLOAD_BASE }}
        run: |
          base="${CNB_DOWNLOAD_BASE%/}/${GITHUB_REF_NAME}"
          mkdir github-public cnb-public
          gh release download "$GITHUB_REF_NAME" --dir github-public --pattern '*'
          for file in dist/*; do
            name="$(basename "$file")"
            cmp "$file" "github-public/$name"
            curl -fsSL "$base/$name" -o "cnb-public/$name"
            cmp "$file" "cnb-public/$name"
          done
      - name: Mark stable release Latest after public verification
        env:
          GH_TOKEN: ${{ github.token }}
          CNB_TOKEN: ${{ secrets.CNB_JKV_TOKEN }}
          CNB_REPOSITORY: ${{ vars.CNB_JKV_REPOSITORY }}
        run: |
          case "$GITHUB_REF_NAME" in *-*) exit 0 ;; esac
          api="https://api.cnb.cool/${CNB_REPOSITORY}/-/releases"
          release_id="$(cat cnb-release-id)"
          curl -fsS -X PATCH "$api/$release_id" \
            -H "Authorization: Bearer $CNB_TOKEN" \
            -H 'Accept: application/vnd.cnb.api+json' \
            -H 'Content-Type: application/json' \
            --data '{"make_latest":"true"}' >/dev/null
          github_release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate | jq -er --arg tag "$GITHUB_REF_NAME" '.[] | select(.tag_name == $tag) | .id')"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/$github_release_id" \
            -F make_latest=true >/dev/null
