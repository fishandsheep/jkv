name: cnb cleanup legacy releases

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delete-legacy-releases:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete legacy CNB releases and tags
        env:
          CNB_TOKEN: ${{ secrets.CNB_JKV_TOKEN }}
        run: |
          set -euo pipefail

          repo='fishandsheep/jkv'
          api="https://api.cnb.cool/${repo}/-/releases"
          headers=(-H "Authorization: Bearer ${CNB_TOKEN}" -H 'Accept: application/vnd.cnb.api+json')
          tags=(v0.1.0 v0.2.0-beta.1 v0.2.0-beta.2 v0.3.0-beta.1 v0.3.0-beta.2)

          test -n "$CNB_TOKEN" || { echo '缺少 CNB_JKV_TOKEN' >&2; exit 1; }
          releases="$(curl -fsS "$api?page=1&page_size=100" "${headers[@]}")"
          jq -c '[.[] | {tag_name, id, draft}]' <<<"$releases"

          for tag in "${tags[@]}"; do
            release_id="$(jq -er --arg tag "$tag" '.[] | select(.tag_name == $tag) | .id' <<<"$releases" || true)"
            if test -z "$release_id"; then
              echo "CNB release already absent: $tag"
              continue
            fi
            body="$(mktemp)"
            status="$(curl -sS -o "$body" -w '%{http_code}' -X DELETE "$api/$release_id" "${headers[@]}" || true)"
            case "$status" in
              200|204) echo "Deleted CNB release: $tag" ;;
              *)
                echo "CNB release deletion failed: tag=$tag id=$release_id status=$status" >&2
                sed -n '1,20p' "$body" >&2
                exit 1
                ;;
            esac
          done

          for tag in "${tags[@]}"; do
            body="$(mktemp)"
            status="$(curl -sS -o "$body" -w '%{http_code}' -X DELETE "https://api.cnb.cool/${repo}/-/git/tags/${tag}" "${headers[@]}" || true)"
            case "$status" in
              204) echo "Deleted CNB tag: $tag" ;;
              404) echo "CNB tag already absent: $tag" ;;
              *)
                echo "CNB tag deletion failed: tag=$tag status=$status" >&2
                sed -n '1,20p' "$body" >&2
                exit 1
                ;;
            esac
          done

          remaining="$(curl -fsS "$api?page=1&page_size=100" "${headers[@]}")"
          for tag in "${tags[@]}"; do
            test "$(jq --arg tag "$tag" '[.[] | select(.tag_name == $tag)] | length' <<<"$remaining")" -eq 0
            curl -sS -o /dev/null -w '%{http_code}' "https://api.cnb.cool/${repo}/-/git/tags/${tag}" "${headers[@]}" | grep -q '^404$'
          done
